<!DOCTYPE html>
<html lang="uk">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Підтвердження Email</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >

</head>

<body class="auth-body">

<main class="auth-shell">

    <section class="auth-panel auth-panel-compact">

        <div class="auth-brand">

            <div class="auth-logo">
                ✓
            </div>

            <h1>
                Підтвердження пошти
            </h1>

            <p>
                Введіть код із листа, щоб активувати акаунт і перейти до входу.
            </p>

        </div>

        <div class="auth-card">

            <p class="auth-eyebrow">
                Останній крок
            </p>

            <h2>
                Код підтвердження
            </h2>

            <label for="verify_code">
                Код з email
            </label>

            <input
                type="text"
                id="verify_code"
                placeholder="000000"
                autocomplete="one-time-code"
            >

            <button onclick="verifyEmail()">
                Підтвердити
            </button>

            <p class="auth-switch">
                Повернутися до
                <a href="login.html">входу</a>
            </p>

        </div>

    </section>

</main>

<script src="js/auth.js"></script>

</body>
</html>
